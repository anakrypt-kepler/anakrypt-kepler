name: Refresh profile artwork

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - scripts/render_profile.py
      - tests/**
      - requirements.txt
      - assets/kepler.jpg
      - assets/JetBrainsMono.woff2
      - .github/workflows/profile.yml

permissions:
  contents: read

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the profile (checkout v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python (setup-python v5.6.0)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the pinned image dependency
        run: python -m pip install -r requirements.txt
      - name: Refresh public data and render both themes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render_profile.py --refresh
      - name: Verify calendar parsing and SVG output
        run: python -m unittest discover -s tests -v
      - name: Keep generated artwork in the job log
        run: |
          git add assets/*-dark.svg assets/*-light.svg assets/github-data.json
          if git diff --cached --quiet; then
            echo "Public profile data is unchanged."
            exit 0
          fi
          git diff --cached --stat
          echo "Artwork changed. Publish it from the anakrypt-kepler account; this workflow does not commit."
          git restore --staged assets/*-dark.svg assets/*-light.svg assets/github-data.json
